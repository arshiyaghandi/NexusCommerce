server:
  port: 8091

spring:
  application:
    name: auth-service
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: nexus-auth-client
            client-secret: ICdEmE4XwvcC1HMLydpsuYwUh9pp0eHm
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/nexus-realm
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/nexus-realm

# ── Keycloak admin client settings ───────────────────────────────────────────
# Credentials injected via environment variables in production.
# Defaults are for local dev only — NEVER commit real passwords here.
nexus:
  keycloak:
    server-url: ${KEYCLOAK_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:nexus-realm}
    admin:
      username: ${KEYCLOAK_ADMIN_USERNAME:admin}
      password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      platform: nexus-commerce
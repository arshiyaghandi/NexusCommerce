input {
  tcp {
    port => 5000
    codec => json_lines
  }
  beats {
    port => 5044
  }
}

filter {
  # Parse level to uppercase for consistency
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }

  # Add timestamp if missing
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Add environment tag
  mutate {
    add_field => { "environment" => "development" }
    add_field => { "platform" => "nexus-commerce" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "nexus-logs-%{[service]}-%{+YYYY.MM.dd}"
    template_name => "nexus-logs"
    template_overwrite => false
  }

  # Debug output (disable in production)
  stdout {
    codec => rubydebug
  }
}
